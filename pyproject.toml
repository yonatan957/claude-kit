[project]
name = "claude-kit"
version = "0.1.0"
description = "Internal, opt-in package manager that keeps every developer's Claude Code setup aligned with an organizational standard."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
claude-kit = "src.commands.config:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.core", "src.commands", "src.ui", "src.registry"]
