[project]
name = "claude-kit"
version = "0.1.0"
description = "Component manager for Claude Code — Skills, Agents, Plugins, Tools, and MCP servers"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "textual>=0.58",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
claude-kit = "src.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
