[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-kit"
version = "0.1.0"
description = "One uniform way to discover, install and remove Claude Code add-ons."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["typer>=0.12"]

[project.scripts]
ck = "claude_kit.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_kit", "src/skillhub_library"]
